name: Sync packages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "space-separated packages to rebuild (empty = auto-detect)"
        required: false
        default: ""
      termux_packages_ref:
        description: "termux/termux-packages ref to build against"
        required: false
        default: "58664109133413425125bbae99a4eaf7d94c61fa"
  push:
    paths:
      - "packages/**"
      - "sync.json"
      - "scripts/sync.py"
      - "scripts/build-package.sh"

permissions:
  contents: write

concurrency:
  group: sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Detect changed packages
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL: ${{ github.event.inputs.packages }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL" ]; then
            changed=$(printf '%s' "$MANUAL" | jq -Rsc 'split(" ") | map(select(. != ""))')
          else
            changed=$(python3 scripts/sync.py detect-all | jq -c '[.[] | select(.changed) | .name]')
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "changed packages: $changed"

      - name: Checkout termux-packages harness
        if: steps.detect.outputs.changed != '[]'
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ inputs.termux_packages_ref || '58664109133413425125bbae99a4eaf7d94c61fa' }}
          path: termux-packages
          fetch-depth: 1

      - name: Build changed packages
        if: steps.detect.outputs.changed != '[]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERMUX_PACKAGES_DIR: ${{ github.workspace }}/termux-packages
          TARGET_ARCH: aarch64
        run: |
          set -euo pipefail
          echo '${{ steps.detect.outputs.changed }}' | jq -r '.[]' | while IFS= read -r pkg; do
            echo "===== bump $pkg ====="
            python3 scripts/sync.py bump --force "$pkg"
            echo "===== build $pkg ====="
            scripts/build-package.sh "$pkg"
          done

      - name: Stage debs (full set)
        if: steps.detect.outputs.changed != '[]'
        run: python3 scripts/sync.py stage-debs

      - name: Import GPG key
        if: steps.detect.outputs.changed != '[]'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Rebuild and sign
        if: steps.detect.outputs.changed != '[]'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          python3 termux-apt-repo debs docs stable main --sign
          gpg --export 476FC230ECBBFDF0 > docs/key.gpg

      - name: Commit and push
        if: steps.detect.outputs.changed != '[]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ packages/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync packages"
          for attempt in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push rejected, retrying (attempt $attempt)..."
            sleep $((RANDOM % 10 + 1))
          done
          echo "::error::push failed after retries"
          exit 1
